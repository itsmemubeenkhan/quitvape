name: Build APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.0'
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons
      - name: Set up release keystore
        run: |
          mkdir -p android/keystore
          if [ -n "${{ secrets.QUITVAPE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.QUITVAPE_KEYSTORE_B64 }}" | base64 -d > android/keystore/quitvape.jks
            echo "Using permanent keystore from QUITVAPE_KEYSTORE_B64 secret"
          else
            echo "ERROR: QUITVAPE_KEYSTORE_B64 secret is not set! Build would use wrong signing key."
            echo "Add the secret in GitHub repo Settings > Secrets > Actions"
            exit 1
          fi
      - name: Build APK
        run: flutter build apk --release --dart-define=NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quitvape-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: quitvape-aab
          path: build/app/outputs/bundle/release/app-release.aab
